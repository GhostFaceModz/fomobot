<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GhostFace FOMOBot v2</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
:root{--bg:#07080c;--card:#10131b;--line:#1e2433;--txt:#d8deea;--mut:#7c869c;--g:#2ee6a6;--r:#ff4d6d;--a:#8b5cf6}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% -10%,#1a1035,var(--bg) 50%);color:var(--txt);font:14px/1.5 Inter,system-ui,sans-serif}
header{padding:28px 32px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;border-bottom:1px solid var(--line)}
h1{margin:0;font-size:26px;letter-spacing:.5px}h1 span{color:var(--a)}
.warn{background:#ff4d6d22;border:1px solid var(--r);color:#ffb3c1;padding:8px 14px;border-radius:8px;font-weight:700;letter-spacing:1px}
main{padding:24px 32px;display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(420px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}.wide{grid-column:1/-1}
h2{margin:0 0 12px;font-size:15px;color:var(--mut);text-transform:uppercase;letter-spacing:1.5px}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--mut);font-weight:500}
.g{color:var(--g)}.r{color:var(--r)}.mut{color:var(--mut)}pre{white-space:pre-wrap;font-size:12px;margin:0}
#plan h1,#plan h2{color:var(--txt);text-transform:none;letter-spacing:0}#plan{font-size:13px}
</style></head><body>
<header><h1>👻 GhostFace <span>FOMOBot</span> <small style="font-size:13px;color:#7c869c">v2 · rug-checked</small></h1><div class="warn">PAPER TRADING, NOT FINANCIAL ADVICE</div><div class="mut" id="upd">loading…</div></header>
<main>
<div class="card wide"><h2>Equity curve per variant (v2, fresh virtual $100 each)</h2><canvas id="eq" height="90"></canvas></div>
<div class="card wide"><h2>Variants</h2><table id="vt"></table></div>
<div class="card"><h2>Open positions</h2><table id="pt"></table></div>
<div class="card"><h2>Best current parameters</h2><pre id="bp"></pre></div>
<div class="card wide"><h2>Wallet copy-trading (paper) · Fomo leaderboard</h2><div id="cs" class="mut"></div><table id="cvt"></table><table id="cwt" style="margin-top:10px"></table></div>
<div class="card wide"><h2>Recent trades</h2><table id="tt"></table></div>
<div class="card wide" id="plan"><h2>Plan</h2><div id="pm"></div></div>
</main>
<script>
const C=['#8b5cf6','#2ee6a6','#f59e0b','#38bdf8','#ff4d6d','#e879f9','#a3e635'];let chart;
const f=(x,d=2)=>x==null?'–':(+x).toFixed(d),cl=x=>x>0?'g':x<0?'r':'';
async function load(){
 const s=await (await fetch('stats.json?'+Date.now())).json();
 document.getElementById('upd').textContent='updated '+new Date(s.updated*1000).toLocaleString()+' · '+s.scans+' scans';
 const ds=Object.entries(s.history).map(([n,h],i)=>({label:n,data:h.map(p=>({x:p[0]*1000,y:p[1]})),borderColor:C[i%7],pointRadius:0,borderWidth:2,tension:.2}));
 if(chart)chart.destroy();
 chart=new Chart(eq,{type:'line',data:{datasets:ds},options:{parsing:false,scales:{x:{type:'linear',ticks:{color:'#7c869c',callback:v=>new Date(v).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})},grid:{color:'#1e2433'}},y:{ticks:{color:'#7c869c'},grid:{color:'#1e2433'}}},plugins:{legend:{labels:{color:'#d8deea'}}}}});
 vt.innerHTML='<tr><th>Variant</th><th>Status</th><th>Equity</th><th>Realized P/L</th><th>Closed</th><th>Expectancy</th><th>Win rate</th><th>Avg win</th><th>Avg loss</th><th>Open</th></tr>'+
  s.variants.map(v=>`<tr><td>${v.name}${v.name==s.best?' 🏆':''}</td><td class="mut">${v.alive?'alive':'retired'} g${v.generation}</td><td class="${cl(v.equity-100)}">$${f(v.equity)}</td><td class="${cl(v.realized)}">${f(v.realized)}</td><td>${v.exits}</td><td class="${cl(v.expectancy_pct)}">${v.expectancy_pct==null?'–':f(v.expectancy_pct)+'%'}</td><td>${v.win_rate==null?'–':v.win_rate+'%'}</td><td class="g">${f(v.avg_win)}</td><td class="r">${f(v.avg_loss)}</td><td>${v.positions.length}</td></tr>`).join('');
 const ps=s.variants.flatMap(v=>v.positions.map(p=>({...p,vn:v.name})));
 pt.innerHTML='<tr><th>Variant</th><th>Token</th><th>Cost</th><th>P/L %</th><th>Held</th></tr>'+(ps.map(p=>`<tr><td>${p.vn}</td><td><a style="color:#8b5cf6" href="https://dexscreener.com/solana/${p.pair}" target=_blank>${p.symbol}</a></td><td>$${f(p.cost)}</td><td class="${cl(p.pnl_pct)}">${f(p.pnl_pct,1)}%</td><td>${f((Date.now()/1000-p.opened)/60,0)}m</td></tr>`).join('')||'<tr><td class=mut colspan=5>none</td></tr>');
 const b=s.variants.find(v=>v.name==s.best);bp.textContent=b?b.name+(b.exits<20?' (provisional: <20 closed trades)':' (judged on expectancy)')+'\n'+JSON.stringify(b.params,null,1):'';
 const k=s.copy;if(!k){cs.textContent='copy bot not started';}else{
  cs.textContent=`Source: ${k.source} · candidates ${k.candidates} · tracked ${k.tracked} · wallet swaps seen ${k.events}`+(k.candidates?'':' · waiting for Fomo leaderboard wallet export');
  cvt.innerHTML='<tr><th>Variant</th><th>Copied entries</th><th>Avg entry delay</th><th>Avg lag cost vs wallet price</th></tr>'+k.variants.map(v=>`<tr><td>${v.name}</td><td>${v.entries}</td><td>${v.avg_entry_delay_s==null?'–':f(v.avg_entry_delay_s,0)+'s'}</td><td class="${cl(-v.avg_lag_cost_pct)}">${v.avg_lag_cost_pct==null?'–':f(v.avg_lag_cost_pct)+'%'}</td></tr>`).join('');
  cwt.innerHTML=k.wallets.length?'<tr><th>Trader</th><th>Wallet</th><th>Fomo rank</th><th>Status</th><th>Closed</th><th>Win rate</th><th>Trimmed mean</th><th>Median hold</th></tr>'+k.wallets.map(w=>{const m=w.metrics||{};return `<tr><td>${w.username||'–'}</td><td class=mut>${w.wallet}</td><td>${w.fomo_rank??'–'}</td><td>${w.tracked?'✅ tracked #'+w.rank:w.passed==null?'vetting…':w.passed?'passed':'rejected: '+((m.fails||[]).join(', '))}</td><td>${m.closed??'–'}</td><td>${m.winrate==null?'–':f(m.winrate*100,0)+'%'}</td><td>${m.trimmed_mean_pct==null?'–':f(m.trimmed_mean_pct,1)+'%'}</td><td>${m.median_hold_min==null?'–':f(m.median_hold_min,0)+'m'}</td></tr>`}).join(''):'';}
 tt.innerHTML='<tr><th>Time</th><th>Variant</th><th>Side</th><th>Token</th><th>USD</th><th>P/L</th><th>%</th><th>Hold</th><th>Reason</th></tr>'+s.trades.map(t=>`<tr><td class=mut>${new Date(t.ts*1000).toLocaleString()}</td><td>${t.variant}</td><td>${t.side}</td><td>${t.symbol}</td><td>$${f(t.usd)}</td><td class="${cl(t.pnl)}">${t.side=='BUY'?'':f(t.pnl)}</td><td class="${cl(t.pnl_pct)}">${t.side=='BUY'?'':f(t.pnl_pct,1)+'%'}</td><td>${t.side=='BUY'?'':f(t.hold_min,0)+'m'}</td><td class=mut>${t.reason}</td></tr>`).join('');
}
fetch('PLAN.md?'+Date.now()).then(r=>r.text()).then(t=>pm.innerHTML=marked.parse(t));
load();setInterval(load,60000);
</script></body></html>
